<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#060A12"/>
    </linearGradient>
    <linearGradient id="neonG" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#00B0FF"/>
      <stop offset="50%" stop-color="#00E676"/>
      <stop offset="100%" stop-color="#00E676"/>
    </linearGradient>
    <clipPath id="circleClip">
      <circle cx="54" cy="54" r="52"/>
    </clipPath>
  </defs>
  <g clip-path="url(#circleClip)">
    <rect width="108" height="108" fill="url(#bgG)"/>
    <circle cx="54" cy="54" r="51" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="54" cy="54" r="47" fill="none" stroke="#00E676" stroke-width="0.8" stroke-dasharray="3 4" opacity="0.4"/>

    <!-- Asfalto -->
    <path d="M 30 86 C 30 66, 76 72, 76 50 C 76 34, 56 28, 54 27" 
          fill="none" stroke="#24334A" stroke-width="20" stroke-linecap="round"/>
    <!-- Trazada Neón -->
    <path d="M 30 86 C 30 66, 76 72, 76 50 C 76 34, 56 28, 54 27" 
          fill="none" stroke="url(#neonG)" stroke-width="4.5" stroke-linecap="round"/>
    
    <!-- Baliza Ámbar -->
    <circle cx="76" cy="50" r="7" fill="none" stroke="#FF9100" stroke-width="1.5" opacity="0.6"/>
    <circle cx="76" cy="50" r="4.5" fill="#FF9100"/>

    <!-- Flecha Deportiva -->
    <g transform="translate(54, 27) rotate(-15)">
      <path d="M 0 -13 L 14 17 L 0 10 L -14 17 Z" fill="#090E17"/>
      <path d="M 0 -11 L 12 15 L 0 9 L -12 15 Z" fill="#00E676"/>
      <path d="M 0 -5 L 8 12 L 0 8 L -8 12 Z" fill="#FFFFFF"/>
    </g>
  </g>
</svg>